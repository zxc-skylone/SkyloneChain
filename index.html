<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>OSINT Chain</title>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #050505;
      --panel: #161616;
      --btn: #242424;
      --btn2: #333;
      --dot: #2b2b2b;
      --fg: #f2f2f2;
      --mut: #8d8d8d;
      --line: #e6e6e6;
      --sel: #ffd24a;
      --bad: #ff7b7b;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px)
    }

    :root[data-t="navy"] {
      --bg: #070b16;
      --panel: #0f1830;
      --btn: #1a2644;
      --btn2: #263660;
      --dot: #1b2742;
      --line: #bcd0ff;
      --sel: #6fb1ff
    }

    :root[data-t="graphite"] {
      --bg: #222428;
      --panel: #2b2d32;
      --btn: #3a3d44;
      --btn2: #4a4e57;
      --dot: #33363c;
      --line: #dcdcdc;
      --sel: #ff9d5c
    }

    * {
      box-sizing: border-box
    }

    html,
    body {
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--bg);
      color: var(--fg);
      font-family: Oswald, "Arial Narrow", "Roboto Condensed", sans-serif;
      font-weight: 300
    }

    svg.i {
      width: 18px;
      height: 18px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.6;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex: none
    }

    #stage {
      position: fixed;
      inset: 0;
      touch-action: none;
      cursor: grab;
      background-image: radial-gradient(var(--dot) 1.4px, transparent 1.6px)
    }

    #stage.pan {
      cursor: grabbing
    }

    #world {
      position: absolute;
      left: 0;
      top: 0;
      transform-origin: 0 0
    }

    #links {
      position: absolute;
      left: 0;
      top: 0;
      overflow: visible;
      pointer-events: none
    }

    #links path {
      fill: none;
      stroke: var(--line);
      stroke-width: 1
    }

    .n {
      position: absolute;
      transform: translate(0, -50%);
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 20px;
      line-height: 1.25;
      padding: 2px 6px;
      border-radius: 4px;
      white-space: pre
    }

    .n .ic {
      color: var(--c);
      display: flex
    }

    .n .ic svg {
      width: 16px;
      height: 16px
    }

    .tx {
      outline: none;
      min-width: 34px;
      cursor: text;
      padding-bottom: 1px;
      border-bottom: 1px solid transparent
    }

    .tx:empty::before {
      content: "Text";
      color: var(--mut)
    }

    .n[data-cf=low] .tx {
      border-bottom: 1px dashed var(--bad)
    }

    .n[data-cf=med] .tx {
      border-bottom: 1px dashed #ffd24a
    }

    .n[data-cf=high] .tx {
      border-bottom: 1px solid #7ee787
    }

    .n.sel {
      box-shadow: 0 0 0 1px var(--sel)
    }

    .n.note::after {
      content: "";
      position: absolute;
      right: -3px;
      top: -3px;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--sel)
    }

    .n.dim {
      opacity: .22
    }

    .n.hit {
      box-shadow: 0 0 0 1px var(--sel), 0 0 14px -2px var(--sel)
    }

    .cnt {
      font: inherit;
      font-size: 13px;
      font-weight: 500;
      color: var(--bg);
      background: var(--sel);
      border: 0;
      border-radius: 9px;
      padding: 0 6px;
      cursor: pointer
    }

    .btn {
      font: inherit;
      font-weight: 400;
      font-size: 16px;
      color: var(--fg);
      background: var(--btn);
      border: 0;
      border-radius: 8px;
      height: 38px;
      padding: 0 12px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      white-space: nowrap;
      text-decoration: none
    }

    .btn:hover {
      background: var(--btn2)
    }

    .btn.sq {
      padding: 0;
      width: 38px;
      justify-content: center
    }

    .btn.pri {
      background: var(--sel);
      color: #111
    }

    .btn.danger {
      color: var(--bad)
    }

    .btn[disabled] {
      opacity: .35;
      pointer-events: none
    }

    button:focus-visible,
    input:focus-visible,
    textarea:focus-visible,
    a:focus-visible {
      outline: 2px solid var(--sel);
      outline-offset: 1px
    }

    #top {
      position: fixed;
      z-index: 10;
      left: 12px;
      right: 12px;
      top: calc(12px + env(safe-area-inset-top, 0px));
      display: flex;
      gap: 8px;
      align-items: center
    }

    #sw {
      position: relative;
      flex: 1;
      max-width: 340px;
      margin: 0 auto
    }

    #sw svg {
      position: absolute;
      left: 10px;
      top: 10px;
      color: var(--mut)
    }

    input,
    textarea {
      font: inherit;
      font-weight: 300;
      font-size: 16px;
      color: var(--fg);
      background: var(--btn);
      border: 0;
      border-radius: 8px;
      padding: 8px 10px;
      width: 100%
    }

    #q {
      padding-left: 34px;
      height: 38px
    }

    #zoom {
      position: fixed;
      z-index: 10;
      left: 12px;
      bottom: calc(12px + env(safe-area-inset-bottom, 0px));
      display: flex;
      flex-direction: column;
      gap: 6px
    }

    .drawer,
    #insp,
    #modal .box {
      background: var(--panel)
    }

    #side {
      position: fixed;
      z-index: 30;
      left: 0;
      top: 0;
      bottom: 0;
      width: 310px;
      max-width: 90vw;
      padding: calc(14px + env(safe-area-inset-top, 0px)) 14px 14px;
      transform: translateX(-104%);
      transition: transform .18s;
      display: flex;
      flex-direction: column;
      gap: 8px;
      overflow: auto
    }

    #side.open {
      transform: none
    }

    #side h2 {
      margin: 0;
      font-size: 26px;
      font-weight: 400;
      flex: 1
    }

    .row {
      display: flex;
      align-items: center;
      gap: 8px
    }

    #side .btn {
      justify-content: flex-start;
      width: 100%
    }

    label {
      display: block;
      font-size: 14px;
      color: var(--mut);
      margin: 10px 0 4px
    }

    .keys {
      font-size: 14px;
      color: var(--mut);
      line-height: 1.7;
      margin-top: 8px
    }

    .keys b {
      color: var(--fg);
      font-weight: 400
    }

    #insp {
      position: fixed;
      z-index: 15;
      right: 12px;
      top: calc(62px + env(safe-area-inset-top, 0px));
      width: 292px;
      max-height: calc(100% - 140px);
      overflow: auto;
      border-radius: 12px;
      padding: 12px;
      display: none
    }

    #insp.show {
      display: block
    }

    #types {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px
    }

    #types button {
      height: 40px;
      border: 1px solid transparent;
      border-radius: 8px;
      background: var(--btn);
      color: var(--c);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer
    }

    #types button.on {
      border-color: var(--c)
    }

    .seg {
      display: flex;
      gap: 6px
    }

    .seg button {
      flex: 1;
      font: inherit;
      font-size: 15px;
      color: var(--fg);
      background: var(--btn);
      border: 1px solid transparent;
      border-radius: 8px;
      height: 34px;
      cursor: pointer
    }

    .seg button.on {
      border-color: var(--sel);
      color: var(--sel)
    }

    #note {
      height: 96px;
      resize: vertical
    }

    .ir {
      display: flex;
      gap: 6px;
      margin-top: 12px;
      flex-wrap: wrap
    }

    #modal {
      position: fixed;
      inset: 0;
      z-index: 40;
      background: rgba(0, 0, 0, .6);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px
    }

    #modal.show {
      display: flex
    }

    #modal .box {
      width: min(560px, 100%);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px
    }

    #mt {
      margin: 0;
      font-size: 24px;
      font-weight: 400
    }

    #mm {
      color: var(--mut);
      font-size: 15px;
      line-height: 1.4
    }

    #mta {
      height: 220px;
      font-size: 14px;
      font-family: ui-monospace, Menlo, Consolas, monospace
    }

    #ma {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
      flex-wrap: wrap
    }

    #toast {
      position: fixed;
      z-index: 50;
      top: calc(64px + env(safe-area-inset-top, 0px));
      left: 50%;
      transform: translateX(-50%);
      background: var(--btn2);
      padding: 7px 16px;
      border-radius: 8px;
      font-size: 16px;
      opacity: 0;
      transition: opacity .2s;
      pointer-events: none
    }

    #toast.show {
      opacity: 1
    }

    @media (max-width:700px) {
      .lbl {
        display: none
      }

      .btn:has(.lbl) {
        padding: 0;
        width: 38px;
        justify-content: center
      }

      #insp {
        left: 8px;
        right: 8px;
        top: auto;
        bottom: 8px;
        width: auto;
        max-height: 48vh
      }

      #zoom {
        display: none
      }
    }

    @media (prefers-reduced-motion:reduce) {
      #side {
        transition: none
      }
    }
  </style>
</head>

<body>

  <div id="stage">
    <div id="world"><svg id="links" width="1" height="1"></svg>
      <div id="nodes"></div>
    </div>
  </div>

  <div id="top">
    <button class="btn sq" data-a="gear" data-ic="gear" aria-label="Settings"></button>
    <button class="btn sq" data-a="undo" data-ic="undo" aria-label="Undo" id="bUndo"></button>
    <button class="btn sq" data-a="redo" data-ic="redo" aria-label="Redo" id="bRedo"></button>
    <div id="sw"><span data-ic="search"></span><input id="q" placeholder="Search nodes" aria-label="Search nodes"></div>
    <button class="btn" data-a="save" data-ic="save"><span class="lbl">Save</span></button>
  </div>

  <div id="zoom">
    <button class="btn sq" data-a="zin" data-ic="plus" aria-label="Zoom in"></button>
    <button class="btn sq" data-a="zout" data-ic="minus" aria-label="Zoom out"></button>
    <button class="btn sq" data-a="fit" data-ic="fit" aria-label="Fit to screen"></button>
  </div>

  <aside id="side" class="drawer">
    <div class="row">
      <h2>Settings</h2><button class="btn sq" data-a="gclose" data-ic="close" aria-label="Close"></button>
    </div>
    <button class="btn" data-a="new" data-ic="newf">New file</button>
    <button class="btn" data-a="open" data-ic="folder">Open file</button>
    <button class="btn" data-a="paste" data-ic="paste">Import from pasted JSON</button>
    <button class="btn" data-a="md" data-ic="dl">Export report (Markdown)</button>
    <button class="btn" data-a="fit2" data-ic="fit">Fit chain to screen</button>
    <label for="cname">Case name</label><input id="cname" placeholder="Case #1">
    <label>Theme</label><button class="btn" data-a="theme" id="themeBtn" style="justify-content:center">Black</button>
    <div class="keys"><b>Enter</b> sibling · <b>Tab</b> child · <b>Del</b> on empty node removes
      it<br><b>Ctrl+Arrows</b> move between nodes · <b>Ctrl+Z / Y</b> undo, redo<br><b>Ctrl+F</b> search · drag
      background to pan · wheel to zoom</div>
  </aside>

  <aside id="insp">
    <div class="row"><b style="flex:1;font-weight:400;font-size:20px">Node</b><button class="btn sq" data-a="desel"
        data-ic="close" aria-label="Close"></button></div>

    <div id="types"></div>
    <label for="src">Source URL</label>

  <div id="toast"></div>
  <input type="file" id="file" accept=".json,application/json" hidden>

  <script>
    (function () {
      var KEY = "osint-chain-v2", ROW = 42, GAP = 66, uid = 1;
      var TYPES = [["person", "Person", "#ffb86b"], ["user", "Username", "#c792ea"], ["mail", "Email", "#6fb1ff"], ["phone", "Phone", "#7ee787"], ["globe", "Domain", "#5eead4"], ["pin", "Location", "#ff7b7b"], ["image", "Media", "#f6e05e"], ["doc", "Document", "#a9b4c4"], ["org", "Organization", "#f78fb3"], ["dot", "Other", "#e6e6e6"]], TC = {};
      TYPES.forEach(function (t) {TC[t[0]] = t});
      var THEMES = ["black", "navy", "graphite"], TN = {black: "Black", navy: "Navy", graphite: "Graphite"};
      var S = {root: null, sel: null, theme: "black", name: "", q: ""}, view = {x: 80, y: 0, k: 1}, els = {}, hist = [], hi = -1, tm = null;
      var $ = function (i) {return document.getElementById(i)}, stage = $("stage"), world = $("world"), nodesEl = $("nodes"), links = $("links");
      function ic(n) {return '<svg class="i" viewBox="0 0 24 24"><use href="#i-' + n + '"/></svg>'}
      document.querySelectorAll("[data-ic]").forEach(function (e) {e.insertAdjacentHTML("afterbegin", ic(e.dataset.ic))});
      $("types").innerHTML = TYPES.map(function (t) {return '<button data-ty="' + t[0] + '" title="' + t[1] + '" aria-label="' + t[1] + '" style="--c:' + t[2] + '">' + ic(t[0]) + '</button>'}).join("");

      /* model */
      function mk(t, ty) {return {id: uid++, t: t || "", ty: ty || "dot", note: "", src: "", cf: "", col: false, ch: []}}
      function norm(n, keep) {var o = {id: keep && typeof n.id === "number" ? n.id : 0, t: String(n.t != null ? n.t : (n.text || "")), ty: TC[n.ty] ? n.ty : "dot", note: n.note || "", src: n.src || "", cf: n.cf || "", col: !!n.col, ch: (n.ch || []).map(function (c) {return norm(c, keep)})}; return o}
      function reid(n) {n.id = uid++; n.ch.forEach(reid)}
      function maxId(n) {var m = n.id; n.ch.forEach(function (c) {m = Math.max(m, maxId(c))}); return m}
      function find(id, n, p) {n = n || S.root; if (n.id === id) return {n: n, p: p || null}; for (var i = 0; i < n.ch.length; i++) {var r = find(id, n.ch[i], n); if (r) return r} return null}
      function kids(n) {return n.col ? [] : n.ch}
      function count(n) {var c = 0; n.ch.forEach(function (x) {c += 1 + count(x)}); return c}
      function fresh() {uid = 1; S.root = mk("Target", "person"); S.root.ch.push(mk("", "dot")); S.sel = S.root.id}
      function strip(n) {return {id: n.id, t: n.t, ty: n.ty, note: n.note, src: n.src, cf: n.cf, col: n.col, ch: n.ch.map(strip)}}
      function dump() {return JSON.stringify({app: "osint-chain", v: 2, name: S.name, theme: S.theme, root: strip(S.root)}, null, 1)}

      /* render */
      function build() {
        nodesEl.innerHTML = ""; els = {};
        (function w(n) {
          var e = document.createElement("div"); e.className = "n"; e.dataset.id = n.id; e.dataset.cf = n.cf; e.style.setProperty("--c", TC[n.ty][2]);

      }

      nodesEl.addEventListener("input", function (e) {var el = e.target.closest(".n"); if (!el) return; find(+el.dataset.id).n.t = e.target.textContent; layout(); later()});
      nodesEl.addEventListener("focusin", function (e) {var el = e.target.closest(".n"); if (el && +el.dataset.id !== S.sel) select(+el.dataset.id)});
      nodesEl.addEventListener("click", function (e) {

      });

      nodesEl.addEventListener("keydown", function (e) {

      });

      /* inspector */
      $("types").addEventListener("click", function (e) {var b = e.target.closest("button"); if (!b) return; var f = find(S.sel); f.n.ty = b.dataset.ty; build(); snap()});
      $("cf").addEventListener("click", function (e) {var b = e.target.closest("button"); if (!b) return; var f = find(S.sel); f.n.cf = f.n.cf === b.dataset.cf ? "" : b.dataset.cf; build(); snap()});
      $("note").addEventListener("input", function () {var f = find(S.sel); f.n.note = this.value; mark(); later()});
      $("src").addEventListener("input", function () {var f = find(S.sel); f.n.src = this.value; setLink(this.value); mark(); later()});
      $("q").addEventListener("input", function () {S.q = this.value; mark()});
      var qi = -1; $("q").addEventListener("keydown", function (e) {

      /* saving: works in the hosted page (downloads capability), standalone (blob link), and always has a copy-paste fallback */
